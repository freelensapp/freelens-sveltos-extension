apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sveltos.sveltos.freelens.app
spec:
  group: sveltos.freelens.app
  names:
    plural: sveltos
    singular: sveltos
    kind: Sveltos
    shortNames:
      - ex
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                active:
                  type: boolean
                otherSveltos:
                  type: array
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
      additionalPrinterColumns:
        - name: Title
          type: string
          jsonPath: .spec.title
          description: A title of the resource
        - name: Active
          type: boolean
          jsonPath: .spec.active
          description: A flag if resource is active
